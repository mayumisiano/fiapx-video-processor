name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GO_VERSION: "1.25"

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test ./... -race -cover

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fiapx
          POSTGRES_PASSWORD: fiapx
          POSTGRES_DB: fiapx
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://fiapx:fiapx@localhost:5432/fiapx?sslmode=disable
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Integration tests
        run: go test -tags=integration ./... -race

  build-images:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: [unit-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Build identity-api image
        run: docker build -f Dockerfile.identity-api -t fiapx-video-processor-identity-api:ci .

      - name: Build video-api image
        run: docker build -f Dockerfile.video-api -t fiapx-video-processor-video-api:ci .

      - name: Build video-worker image
        run: docker build -f Dockerfile.video-worker -t fiapx-video-processor-video-worker:ci .
