services:
  postgres-identity:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${IDENTITY_POSTGRES_USER}
      POSTGRES_PASSWORD: ${IDENTITY_POSTGRES_PASSWORD}
      POSTGRES_DB: ${IDENTITY_POSTGRES_DB}
    ports:
      - "${IDENTITY_POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_identity_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${IDENTITY_POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-video:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${VIDEO_POSTGRES_USER}
      POSTGRES_PASSWORD: ${VIDEO_POSTGRES_PASSWORD}
      POSTGRES_DB: ${VIDEO_POSTGRES_DB}
    ports:
      - "${VIDEO_POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_video_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${VIDEO_POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    # rabbitmq_prometheus ships in the -management image already in use;
    # it just isn't enabled by default. Exposes /metrics on 15692 for
    # Prometheus (queue depth, message rates) with zero application code.
    command: ["sh", "-c", "rabbitmq-plugins enable --offline rabbitmq_prometheus && exec rabbitmq-server"]
    ports:
      - "5672:5672"
      - "15672:15672"
      - "15692:15692"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  identity-api:
    build:
      context: .
      dockerfile: Dockerfile.identity-api
    depends_on:
      postgres-identity:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    ports:
      - "${IDENTITY_HOST_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8081/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  video-api:
    build:
      context: .
      dockerfile: Dockerfile.video-api
    depends_on:
      postgres-video:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file: .env
    ports:
      - "${API_HOST_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  video-worker:
    build:
      context: .
      dockerfile: Dockerfile.video-worker
    depends_on:
      postgres-video:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file: .env
    # No host port published: Prometheus scrapes video-worker:9102 over
    # the internal Docker network, and a fixed host mapping would collide
    # across replicas when scaled (docker compose up --scale
    # video-worker=N) — the exact scenario this service exists to serve.

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - identity-api
      - video-api
      - video-worker

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  postgres_identity_data:
  postgres_video_data:
  minio_data:
