services:
  postgres-identity:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${IDENTITY_POSTGRES_USER}
      POSTGRES_PASSWORD: ${IDENTITY_POSTGRES_PASSWORD}
      POSTGRES_DB: ${IDENTITY_POSTGRES_DB}
    ports:
      - "${IDENTITY_POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_identity_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${IDENTITY_POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-video:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${VIDEO_POSTGRES_USER}
      POSTGRES_PASSWORD: ${VIDEO_POSTGRES_PASSWORD}
      POSTGRES_DB: ${VIDEO_POSTGRES_DB}
    ports:
      - "${VIDEO_POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_video_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${VIDEO_POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  createbuckets:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ACCESS_KEY $$MINIO_SECRET_KEY &&
      mc mb -p local/videos &&
      mc mb -p local/results
      "

  migrate-identity:
    image: migrate/migrate:v4.17.1
    depends_on:
      postgres-identity:
        condition: service_healthy
    volumes:
      - ./migrations/identity:/migrations
    command: ["-path", "/migrations", "-database", "${IDENTITY_DATABASE_URL}", "up"]

  migrate-video:
    image: migrate/migrate:v4.17.1
    depends_on:
      postgres-video:
        condition: service_healthy
    volumes:
      - ./migrations/video:/migrations
    command: ["-path", "/migrations", "-database", "${VIDEO_DATABASE_URL}", "up"]

  identity-api:
    build:
      context: .
      dockerfile: Dockerfile.identity-api
    depends_on:
      postgres-identity:
        condition: service_healthy
      migrate-identity:
        condition: service_completed_successfully
    env_file: .env
    ports:
      - "${IDENTITY_HOST_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8081/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  video-api:
    build:
      context: .
      dockerfile: Dockerfile.video-api
    depends_on:
      postgres-video:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate-video:
        condition: service_completed_successfully
    env_file: .env
    ports:
      - "${API_HOST_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  video-worker:
    build:
      context: .
      dockerfile: Dockerfile.video-worker
    depends_on:
      postgres-video:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate-video:
        condition: service_completed_successfully
    env_file: .env

volumes:
  postgres_identity_data:
  postgres_video_data:
  minio_data:
