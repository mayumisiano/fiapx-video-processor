global:
  scrape_interval: 5s

scrape_configs:
  - job_name: identity-api
    static_configs:
      - targets: ["identity-api:8081"]

  - job_name: video-api
    static_configs:
      - targets: ["video-api:8080"]

  - job_name: video-worker
    static_configs:
      - targets: ["video-worker:9102"]

  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]
